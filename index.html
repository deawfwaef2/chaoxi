</style></head><body><canvas id="c"></canvas><div class="ui"><button class="pause" id="pause">Ⅱ</button><div class="top"><div class="pill">潮汐等级 <b id="level">0</b><div class="bar"><i id="tidebar"></i></div></div><div class="pill">本轮观测 <b id="obs">0</b> · <span id="clock">10.0s</span></div><div class="pill">守恒能量 <b id="energy">0</b></div><div class="pill">生态 <b id="eco">萌芽</b></div></div><div class="right panel"><h3>异星观测构筑</h3><button class="build" data-b="pylon">◇ 供能塔 <small>80 能量 · 扩展覆盖</small></button><button class="build" data-b="trip">⌁ 涟漪门 <small>110 能量 · 生物经过计数</small></button><button class="build" data-b="lens">◉ 生态透镜 <small>180 能量 · 观测多样性</small></button><button class="build" data-b="nursery">✿ 共生温床 <small>240 能量 · 促进繁衍</small></button><div class="stats" id="stats"></div></div><div class="legend">✦ 地图能量　● 生物能量<br>点击：白球跃迁　滚轮：缩放<br>靠近中心方塔可从能量池建造</div><div class="bottom"><span class="hint" id="hint">WASD 移动 · 选择装置后点击地图建造 · 每10秒结算</span></div><div class="toast" id="toast"></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div></div><div class="modal" id="modal"><div class="card"><div style="font-size:46px;filter:drop-shadow(0 0 18px #fff)">◉</div><h1 class="logo">潮汐生态圈</h1><p>能量不会消失，只会流转。培育软萌生灵，以异星装置观察它们的每一次相遇，让一座脆弱的小世界持续呼吸。</p><button class="start" id="start">唤醒方塔</button><div class="stats">单文件离线版 · 自动存档 · 离线推演</div></div></div><script>
'use strict';
const C=document.querySelector('#c'),X=C.getContext('2d',{alpha:false}),DPR=Math.min(devicePixelRatio||1,2);let W,H;
function resize(){W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2, WORLD=1200, START_R=430, TOTAL=12000, SAVE='chaoxi-save-v1';
let playing=false,paused=false,last=0,time=0,cycle=10,obs=0,tide=0,tideProgress=0,worldR=START_R,selected='',shake=0,cam={x:0,y:0,z:1},keys={},joy={x:0,y:0,id:null},particles=[],energy=[],creatures=[],devices=[];
const player={x:0,y:100,e:100,max:100};
const species={
 slime:{name:'露珠团',color:'#8ff0c7',accent:'#effff8',r:12,speed:18,met:0.20,breed:62,age:220,diet:'energy'},
 puff:{name:'云绒兽',color:'#ffe9b2',accent:'#fff',r:16,speed:14,met:0.27,breed:88,age:300,diet:'energy'},
 nib:{name:'星耳狐',color:'#f5a8cb',accent:'#fff1f8',r:18,speed:25,met:0.38,breed:125,age:360,diet:'prey'}
};
const cost={pylon:80,trip:110,lens:180,nursery:240};
function rnd(a=1,b=0){return b+Math.random()*(a-b)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function seed(){energy=[];creatures=[];devices=[];for(let i=0;i<1100;i++){let a=rnd(TAU),r=Math.pow(Math.random(),2)*350;energy.push({x:Math.cos(a)*r,y:Math.sin(a)*r,e:TOTAL/1100,phase:rnd(TAU)})}for(let i=0;i<20;i++)spawn(i<13?'slime':i<18?'puff':'nib',rnd(240,-240),rnd(240,-240),i<18?45:95);devices.push({type:'tower',x:0,y:0,ready:1,phase:0})}
function spawn(type,x,y,e,age=0){let s=species[type];creatures.push({type,x,y,e,age,vx:rnd(s.speed,-s.speed),vy:rnd(s.speed,-s.speed),phase:rnd(TAU),cool:rnd(20),seen:0})}
function burst(x,y,col,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(45,-45),vy:rnd(45,-45),life:rnd(1,.4),col})}
function groundEnergy(x,y,amount){if(amount<=0)return;let best=null,bd=35;for(let e of energy){let d=Math.hypot(e.x-x,e.y-y);if(d<bd){best=e;bd=d}}if(best)best.e+=amount;else energy.push({x,y,e:amount,phase:rnd(TAU)})}
function takeEnergy(x,y,amount){let got=0;for(let i=0;i<energy.length&&got<amount;i++){let e=energy[i],d=Math.hypot(e.x-x,e.y-y);if(d<45){let q=Math.min(e.e,amount-got);e.e-=q;got+=q}}return got}
function updateCreature(c,dt,i){let s=species[c.type];c.age+=dt;c.cool-=dt;c.phase+=dt*4;let rr=Math.hypot(c.x,c.y);if(rr>worldR-25){c.vx-=c.x/rr*50*dt;c.vy-=c.y/rr*50*dt}
 if(s.diet==='energy'){let target=null,bd=100;for(let k=0;k<energy.length;k+=3){let e=energy[k],d=Math.hypot(e.x-c.x,e.y-c.y);if(e.e>1&&d<bd){target=e;bd=d}}if(target){c.vx+=(target.x-c.x)/bd*14*dt;c.vy+=(target.y-c.y)/bd*14*dt;if(bd<20){let q=Math.min(target.e,dt*3.5);target.e-=q;c.e+=q;obs+=q*.025}}}
 else{let prey=null,bd=120;for(let j=0;j<creatures.length;j+=2){let q=creatures[j];if(q!==c&&q.type!=='nib'){let d=dist(c,q);if(d<bd){prey=q;bd=d}}}if(prey){c.vx+=(prey.x-c.x)/bd*28*dt;c.vy+=(prey.y-c.y)/bd*28*dt;if(bd<s.r+species[prey.type].r){c.e+=prey.e;prey.e=0;prey.dead=1;obs+=1.5;burst(prey.x,prey.y,species[prey.type].color,12)}}}
 c.vx+=rnd(8,-8)*dt;c.vy+=rnd(8,-8)*dt;let sp=Math.hypot(c.vx,c.vy)||1,lim=s.speed*(.8+Math.min(c.e/s.breed,1));if(sp>lim){c.vx*=lim/sp;c.vy*=lim/sp}c.x+=c.vx*dt;c.y+=c.vy*dt;c.e-=s.met*dt;
 for(let d of devices){if(d.ready<1)continue;let dd=dist(c,d);if(d.type==='trip'&&dd<31&&!c.seen){c.seen=1;obs+=1;setTimeout(()=>c.seen=0,900)}if(d.type==='nursery'&&dd<105)c.cool-=dt*.7}
 if(c.e>s.breed&&c.cool<0&&creatures.length<3500){let gift=c.e*.34;c.e-=gift;spawn(c.type,c.x+rnd(16,-16),c.y+rnd(16,-16),gift);c.cool=rnd(35,22);obs+=2;burst(c.x,c.y,s.color,8)}
 if(c.e<=.1||c.age>s.age){groundEnergy(c.x,c.y,Math.max(0,c.e));c.dead=1;burst(c.x,c.y,s.color,10)} }
function update(dt){time+=dt;cycle-=dt;if(cycle<=0)settle();let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,l=Math.hypot(dx,dy)||1;player.x+=dx/l*150*dt;player.y+=dy/l*150*dt;let pr=Math.hypot(player.x,player.y);if(pr>worldR-8){player.e-=dt*10*(1+(pr-worldR)/100);player.x*=1-0.12*dt;player.y*=1-0.12*dt}player.e=Math.min(player.max,player.e+dt*.7);cam.x+=(player.x-cam.x)*.08;cam.y+=(player.y-cam.y)*.08;
 for(let d of devices){d.phase+=dt;d.ready=Math.min(1,d.ready+dt/(d.type==='pylon'?4:7))}
 for(let i=0;i<creatures.length;i++)updateCreature(creatures[i],dt,i);creatures=creatures.filter(c=>!c.dead);energy=energy.filter(e=>e.e>.02);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.97;p.vy*=.97}particles=particles.filter(p=>p.life>0);if(Math.floor(time)%7===0&&energy.length>1500)mergeEnergy();updateUI()}
function mergeEnergy(){for(let i=energy.length-1;i>900;i-=2){let e=energy[i],q=energy[i-1];q.e+=e.e;energy.splice(i,1)}}
function settle(){cycle+=10;let counts=Object.keys(species).map(k=>creatures.filter(c=>c.type===k).length),div=counts.filter(n=>n>1).length,stability=Math.min(5,creatures.length/15)*Math.min(1,div/3);let earned=Math.round(obs*stability);if(tide===0&&devices.length>1&&earned===0){}else tideProgress+=earned;if(tideProgress>=(tide+1)*35&&tide<5){tide++;toast('潮汐共鸣升至 '+tide+' 级');burst(0,0,'#7ff',40);worldR+=55}if(earned<2&&tide>0){tideProgress=Math.max(0,tideProgress-8);if(tideProgress===0){tide--;toast('潮汐衰退，装置进入遗迹休眠')}}obs=0;save()}
function totalEnergy(){return energy.reduce((a,e)=>a+e.e,0)+creatures.reduce((a,c)=>a+c.e,0)+devices.reduce((a,d)=>a+(d.invest||0),0)}
function powered(x,y){if(Math.hypot(x,y)<145)return true;return devices.some(d=>d.type==='pylon'&&d.ready>=1&&dist(d,{x,y})<155&&poweredChain(d,new Set()))}function poweredChain(d,seen){if(seen.has(d))return false;seen.add(d);if(Math.hypot(d.x,d.y)<190)return true;return devices.some(q=>q!==d&&q.type==='pylon'&&q.ready>=1&&dist(d,q)<190&&poweredChain(q,seen))}
function build(x,y){if(!selected)return;let c=cost[selected];if(Math.hypot(x,y)>worldR-30)return toast('黑墙之外无法构筑');if(!powered(x,y))return toast('需要连接供能塔覆盖');let got=takeEnergy(0,0,c);if(got<c){groundEnergy(0,0,got);return toast('中心能量不足 '+c)}devices.push({type:selected,x,y,ready:.01,phase:0,invest:c});toast('开始构筑：'+{pylon:'供能塔',trip:'涟漪门',lens:'生态透镜',nursery:'共生温床'}[selected]);selected='';document.querySelectorAll('.build').forEach(b=>b.classList.remove('on'));save()}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({at:Date.now(),tide,tideProgress,worldR,player,energy,creatures,devices}))}catch(e){}}
function load(){let s;try{s=JSON.parse(localStorage.getItem(SAVE))}catch(e){}if(!s){seed();return}({tide,tideProgress,worldR}=s);Object.assign(player,s.player);energy=s.energy||[];creatures=s.creatures||[];devices=s.devices||[];let off=Math.min(28800,Math.max(0,(Date.now()-s.at)/1000));if(off>30){let steps=Math.min(500,Math.ceil(off/30)),dt=off/steps;for(let k=0;k<steps;k++){for(let c of creatures)updateCreature(c,dt,0);creatures=creatures.filter(c=>!c.dead)}setTimeout(()=>toast('离线推演 '+Math.floor(off/60)+' 分钟：现存 '+creatures.length+' 只生物'),500)}}
function sx(x){return (x-cam.x)*cam.z+W/2}function sy(y){return (y-cam.y)*cam.z+H/2}function world(x,y){return{x:(x-W/2)/cam.z+cam.x,y:(y-H/2)/cam.z+cam.y}}
function circle(x,y,r,col){X.beginPath();X.arc(sx(x),sy(y),r*cam.z,0,TAU);X.fillStyle=col;X.fill()}
function draw(){X.fillStyle='#03070c';X.fillRect(0,0,W,H);X.save();let cx=sx(0),cy=sy(0),wr=worldR*cam.z;let g=X.createRadialGradient(cx,cy,0,cx,cy,wr);g.addColorStop(0,'#102b32');g.addColorStop(.7,'#08151c');g.addColorStop(1,'#010204');X.beginPath();X.arc(cx,cy,wr,0,TAU);X.fillStyle=g;X.fill();X.strokeStyle='#000';X.lineWidth=Math.max(16,50*cam.z);X.stroke();X.setLineDash([3,12]);X.strokeStyle='#65ffff33';X.lineWidth=1;X.stroke();X.setLineDash([]);
 for(let e of energy){let px=sx(e.x),py=sy(e.y);if(px<-10||py<-10||px>W+10||py>H+10)continue;let r=(1.8+Math.min(3,e.e*.12))*cam.z;X.fillStyle='#78ffe8aa';X.beginPath();X.arc(px,py,r,0,TAU);X.fill()}
 for(let d of devices)drawDevice(d);for(let c of creatures)drawCreature(c);for(let p of particles){X.globalAlpha=Math.max(0,p.life);circle(p.x,p.y,2,p.col)}X.globalAlpha=1;drawPlayer();X.restore();requestAnimationFrame(loop)}
function drawCreature(c){let s=species[c.type],x=sx(c.x),y=sy(c.y),r=s.r*cam.z,bob=Math.sin(c.phase)*2*cam.z;if(x<-40||x>W+40||y<-40||y>H+40)return;X.save();X.translate(x,y+bob);let squash=1+Math.sin(c.phase*1.4)*.06;X.scale(1/squash,squash);X.shadowBlur=12;X.shadowColor=s.color;X.fillStyle=s.color;X.beginPath();X.ellipse(0,0,r,r*.82,0,0,TAU);X.fill();if(c.type==='nib'){X.beginPath();X.moveTo(-r*.7,-r*.5);X.lineTo(-r*.35,-r*1.2);X.lineTo(0,-r*.65);X.moveTo(r*.7,-r*.5);X.lineTo(r*.35,-r*1.2);X.lineTo(0,-r*.65);X.fill()}X.shadowBlur=0;X.fillStyle='#173039';X.beginPath();X.arc(-r*.32,-r*.08,Math.max(1.3,r*.1),0,TAU);X.arc(r*.32,-r*.08,Math.max(1.3,r*.1),0,TAU);X.fill();X.strokeStyle='#173039';X.lineWidth=Math.max(1,r*.07);X.beginPath();X.arc(0,r*.13,r*.2,.1,Math.PI-.1);X.stroke();X.restore()}
function drawDevice(d){let x=sx(d.x),y=sy(d.y),z=cam.z,active=tide>0||d.type==='tower';X.save();X.translate(x,y);X.globalAlpha=d.ready<1?.45+.4*d.ready:active?1:.32;X.rotate(d.phase*(d.type==='tower'?.15:.05));X.strokeStyle=active?'#72fff0':'#52636a';X.fillStyle='#102d37';X.lineWidth=Math.max(1,2*z);X.shadowBlur=active?18:0;X.shadowColor='#56ffee';let r=(d.type==='tower'?35:d.type==='pylon'?17:22)*z;X.beginPath();for(let i=0;i<6;i++){let a=i*TAU/6;X.lineTo(Math.cos(a)*r,Math.sin(a)*r)}X.closePath();X.fill();X.stroke();if(d.type==='tower'){X.rotate(-d.phase*.5);X.strokeRect(-r*.35,-r*.9,r*.7,r*1.8)}else if(d.type==='trip'){X.beginPath();X.arc(0,0,r*1.45,0,TAU);X.stroke()}else if(d.type==='lens'){X.beginPath();X.ellipse(0,0,r*.45,r*1.2,0,0,TAU);X.stroke()}else if(d.type==='nursery'){for(let i=0;i<3;i++){X.beginPath();X.arc(Math.cos(i*TAU/3)*r*.7,Math.sin(i*TAU/3)*r*.7,r*.42,0,TAU);X.stroke()}}if(d.ready<1){X.rotate(-d.phase);X.fillStyle='#9ff';X.fillRect(-r,-r-8,r*2*d.ready,3)}X.restore()}
function drawPlayer(){let x=sx(player.x),y=sy(player.y),r=10*cam.z;let g=X.createRadialGradient(x,y,0,x,y,r*2.5);g.addColorStop(0,'#fff');g.addColorStop(.25,'#efffff');g.addColorStop(1,'#8ff0');X.fillStyle=g;X.beginPath();X.arc(x,y,r*2.5,0,TAU);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(x,y,r,0,TAU);X.fill()}
function updateUI(){document.querySelector('#level').textContent=tide;document.querySelector('#obs').textContent=obs.toFixed(1);document.querySelector('#clock').textContent=Math.max(0,cycle).toFixed(1)+'s';document.querySelector('#tidebar').style.width=Math.min(100,tideProgress/((tide+1)*35)*100)+'%';document.querySelector('#energy').textContent=Math.round(totalEnergy());let n=creatures.length,div=new Set(creatures.map(c=>c.type)).size;document.querySelector('#eco').textContent=n<5?'濒危':div>=3&&n>25?'和谐':n>12?'生长':'萌芽';document.querySelector('#stats').innerHTML=`生物 ${n} · 物种 ${div}<br>装置 ${devices.length-1} · 白球 ${Math.round(player.e)}%<br><span class="${Math.abs(totalEnergy()-TOTAL)>2?'warn':''}">能量误差 ${Math.round(totalEnergy()-TOTAL)}</span>`}
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),2200)}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(playing&&!paused)update(dt);draw()}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')paused=!paused});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);C.addEventListener('wheel',e=>{cam.z=clamp(cam.z*Math.exp(-e.deltaY*.001),.45,2.2);e.preventDefault()},{passive:false});
C.addEventListener('pointerdown',e=>{if(!playing)return;let p=world(e.clientX,e.clientY);if(selected){build(p.x,p.y);return}let d=Math.hypot(p.x-player.x,p.y-player.y);if(d<260&&player.e>5){player.x=p.x;player.y=p.y;player.e-=5;burst(p.x,p.y,'#fff',10)}else toast('跃迁距离过远')});
document.querySelectorAll('.build').forEach(b=>b.onclick=()=>{selected=b.dataset.b;document.querySelectorAll('.build').forEach(q=>q.classList.toggle('on',q===b));document.querySelector('#hint').textContent='点击供能范围内的位置放置 · ESC 取消'});document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};
