<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.lc{color:#9ff4ff}.ec{color:#ffb070}.bc{color:#ffc8f0}.sc{color:#9aa}

#tide{left:50%;top:10px;transform:translateX(-50%);padding:8px 14px 9px;min-width:280px;text-align:center;cursor:pointer}

#tideSub{font-size:11px;opacity:.75;margin-top:2px}
#tideBar{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}

#mm{right:10px;top:10px;width:150px;height:150px;border-radius:50%;overflow:hidden;padding:0}

#side{right:10px;top:170px;display:flex;flex-direction:column;gap:8px}

.btn:hover{background:rgba(26,56,86,.9)}.btn:active{transform:scale(.95)}
.btn.big{font-size:20px;padding:14px 40px;border-radius:30px}
.btn.ad{border-color:rgba(255,210,120,.6);color:#ffe7b0}
.btn.red{border-color:rgba(255,120,120,.5);color:#ffc0c0}

@keyframes tin{from{transform:translateX(-20px);opacity:0}}

.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:3px 0 5px}.bar i{display:block;height:100%}

#joy{left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(120,200,255,.08);border:1px solid rgba(120,200,255,.25);display:none;touch-action:none}
#joyK{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(200,240,255,.35);border:1px solid rgba(255,255,255,.5)}

#adSim{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.92);font-size:16px}

#report,#offline{display:none}

#offBar{height:10px;border-radius:5px;background:#123;overflow:hidden}#offBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fd8ff,#ffb3f2)}
canvas.spark{width:100%;height:90px;display:block;background:rgba(255,255,255,.03);border-radius:8px}
table.tb{border-collapse:collapse;width:100%;font-size:12px}table.tb td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
@media (max-width:700px){
  #stats{font-size:11px;min-width:150px;padding:6px 8px}
  #tide{top:auto;bottom:auto;top:10px;left:auto;right:10px;transform:none;min-width:0;width:calc(100vw - 190px);max-width:260px;padding:6px 10px}
  #tideLv{font-size:14px}
  #mm{width:100px;height:100px;top:auto;bottom:auto;right:10px;top:84px}
  #side{top:194px}
  #speedTag{top:200px}
  .sbtn{width:48px;height:48px}
  #start h1{font-size:32px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats" class="hud glass"></div>
<div id="tide" class="hud glass"><div id="tideLv">潮汐 Lv.0</div><div id="tideBar"><div id="tideFill"></div><div id="tideWin"></div></div><div id="tideSub"></div></div>
<div id="mm" class="hud glass"><canvas id="mmC" width="150" height="150"></canvas></div>
<div id="side" class="hud">
  <button class="btn sbtn" id="bTower"><span>🔷</span>方塔</button>
  <button class="btn sbtn" id="bDex"><span>📖</span>图鉴</button>
  <button class="btn sbtn ad" id="bSpeed"><span>⏩</span>加速</button>
  <button class="btn sbtn" id="bMenu"><span>☰</span>菜单</button>
</div>
<div id="speedTag" class="hud glass" style="padding:4px 8px"></div>
<div id="toasts" class="hud"></div>
<div id="hint" class="hud glass"></div>
<div id="card" class="hud glass"></div>
<div id="buildBar" class="hud glass"><span id="bbName"></span><button class="btn" id="bbRot">旋转</button><button class="btn" id="bbOk" style="display:none">确认建造</button><button class="btn red" id="bbCancel">取消</button></div>
<div id="joy" class="hud"><div id="joyK"></div></div>
<button id="attBtn" class="hud btn">吸引<br>能量</button>
<div id="panel"><div id="pBox" class="glass"><div id="pHead"><div id="pTitle"></div><button class="btn" id="pClose">✕</button></div><div id="pTabs"></div><div id="pBody"></div></div></div>
<div id="adSim"><div>📺 模拟广告（本地测试模式）</div><div id="adCount">3</div><div style="font-size:12px;opacity:.6">上传到 CrazyGames / Playgama / Poki 等平台后会自动替换为真实广告</div><button class="btn" id="adSkip">取消</button></div>
<div id="offline" class="overlay"><div class="glass"><div style="font-size:18px;font-weight:700">🌙 离线推演中…</div><div id="offTxt" style="opacity:.8">你离开期间，生态圈仍在运转</div><div id="offBar"><i></i></div><button class="btn" id="offSkip" style="margin-top:10px">跳过剩余推演</button></div></div>
<div id="report" class="overlay" style="background:rgba(0,0,0,.6)"><div class="glass" id="repBox"></div></div>
<div id="start" class="overlay">
  <h1>潮汐生态圈</h1>
  <div class="sub">在黑墙包围的圆形小世界里，搭配可爱的生物与异星观测装置，<br>让能量守恒的生态圈稳定运转，把【观测潮汐】推向最高等级。</div>
  <div class="icons" id="startIcons"></div>
  <button class="btn big" id="bStart">开始游戏</button>
  <button class="btn" id="bNew" style="display:none">新的世界（重新开始）</button>
  <div class="keys">电脑：WASD / 方向键移动 · 点击地面瞬移 · 滚轮缩放 · 按住空格吸引能量 · 撞向黑墙可消融 · B 打开方塔 · R 旋转 · Esc 取消<br>手机：左下摇杆移动 · 点地面瞬移 · 双指缩放 · 右下按钮吸引能量</div>
  <div class="keys" id="ver"></div>
</div>
<script>
'use strict';
/* ===================== 常量与数据表 ===================== */
const VERSION = '0.3';
const CELL = 24, GN = 400, HALF = GN * CELL / 2;      // 墙体网格：400x400 格，每格 24px，世界 ±4800
const SC = 48, SN = 200, SNC = SN * SN;               // 空间网格（生物/能量查询）
const MAXP = 240000, MAXC = 24000;                    // 能量粒子 / 生物 上限
const START_R = 470, VOID_R = 4550;                   // 开局开放半径 / 虚空边界（不可破坏）
const TOWER_R = 40, TOWER_FIELD = 250, PYLON_FIELD = 175, TOWER_PULL = 300;
const WINDOW = 10;                                    // 潮汐结算窗口（秒）
const THRESH = [0, 2, 6, 14, 28, 50, 80, 120, 175, 250, 350];
const MAXLV = 10;
const LV_NAMES = ['沉寂', '微澜', '涟漪', '细流', '回涌', '潮起', '盈潮', '大潮', '天潮', '星潮', '永恒之潮'];
const LV_COLORS = ['#707a88', '#6fd8ff', '#5ff0c8', '#8cff7a', '#e6ff6a', '#ffd35a', '#ff9f5a', '#ff6fa8', '#c77dff', '#8f9bff', '#ffffff'];
const ET_NAME = ['光能', '余烬'];
const ET_COLOR = ['#9ff4ff', '#ffb070'];

// 行为类型
const MV_WALK = 0, MV_SLOW = 1, MV_HOP = 2, MV_FLY = 3, MV_FLOAT = 4, MV_ORBIT = 5;

/* 生物表
   eat: 可吃的能量类型（0 光能 / 1 余烬）；prey: 可捕食的物种 key
   exc: 代谢排出的能量类型；死亡时能量全部以【光能】爆出
   life 寿命(秒) mature 成熟(秒) meta 代谢(能量/秒) cost 召唤消耗(方塔附近光能) */
const SPECIES = [
  { key: 'slime', name: '啵啵史莱姆', unlock: 0, r: 9, maxE: 24, repE: 20, childE: 9, life: 170, mature: 22, speed: 36, meta: 0.10, eat: [0], exc: 1, sense: 150, mv: MV_WALK, cost: 12, col: '#7cf5b0', col2: '#3fc98a', desc: '最常见的软糯史莱姆，吃光能，排出余烬。会分裂繁殖。' },
  { key: 'mush', name: '菇菇仔', unlock: 0, r: 10, maxE: 30, repE: 25, childE: 11, life: 260, mature: 30, speed: 15, meta: 0.12, eat: [1], exc: 0, sense: 130, mv: MV_SLOW, cost: 12, col: '#ff8a8a', col2: '#fff1dc', desc: '分解者。吃余烬，排出光能，是生态循环的关键。慢吞吞。' },
  { key: 'bunny', name: '团子兔', unlock: 1, r: 10, maxE: 26, repE: 17, childE: 8, life: 140, mature: 18, speed: 66, meta: 0.14, eat: [0], exc: 1, sense: 170, mv: MV_HOP, pair: true, social: 1, cost: 14, col: '#fff4fa', col2: '#ffb8d6', desc: '蹦蹦跳跳的麻薯兔，吃光能。需要两只一起才能繁殖。' },
  { key: 'firefly', name: '萤火团', unlock: 2, r: 6, maxE: 12, repE: 10, childE: 4, life: 95, mature: 14, speed: 52, meta: 0.07, eat: [1], exc: 0, sense: 160, mv: MV_FLY, social: 1, cost: 8, col: '#fff27a', col2: '#9be86a', desc: '成群飞舞的小光团，吃余烬、排出光能。' },
  { key: 'fox', name: '圆滚狸', unlock: 2, r: 13, maxE: 70, repE: 60, childE: 28, life: 270, mature: 50, speed: 68, meta: 0.3, prey: ['slime', 'bunny', 'firefly'], exc: 1, sense: 230, mv: MV_WALK, pair: true, social: 1, bite: 0.38, cost: 36, col: '#ffb45c', col2: '#fff0dc', desc: '圆滚滚的小狸，捕食史莱姆、团子兔和萤火团。' },
  { key: 'fish', name: '泡泡鱼', unlock: 3, r: 8, maxE: 18, repE: 15, childE: 6, life: 115, mature: 18, speed: 58, meta: 0.10, eat: [0], exc: 1, sense: 160, mv: MV_FLOAT, social: 1, cost: 10, col: '#7ab8ff', col2: '#cfe6ff', desc: '在空气里游泳的泡泡鱼，成群结队吃光能。' },
  { key: 'snail', name: '果冻蜗牛', unlock: 3, r: 11, maxE: 60, repE: 48, childE: 20, life: 540, mature: 80, speed: 11, meta: 0.09, eat: [1], exc: 0, sense: 140, mv: MV_SLOW, cost: 30, col: '#c9a8ff', col2: '#ffd1f0', desc: '背着果冻壳的长寿分解者，吃余烬、排出光能。' },
  { key: 'bear', name: '布丁熊', unlock: 4, r: 20, maxE: 160, repE: 130, childE: 55, life: 480, mature: 90, speed: 52, meta: 0.48, prey: ['fox', 'fish', 'bunny', 'snail'], exc: 1, sense: 270, mv: MV_WALK, pair: true, bite: 0.45, cost: 80, col: '#e8b27a', col2: '#fff3c4', desc: '大块头布丁熊，捕食圆滚狸、泡泡鱼、团子兔和蜗牛。' },
  { key: 'jelly', name: '星星水母', unlock: 5, r: 11, maxE: 30, repE: 26, childE: 10, life: 210, mature: 30, speed: 32, meta: 0.12, eat: [0], exc: 1, sense: 150, mv: MV_ORBIT, cost: 16, col: '#9ff0ff', col2: '#ffb3f2', desc: '绕着方塔巡游的星星水母，吃光能。' },
  { key: 'bird', name: '棉花鸟', unlock: 6, r: 12, maxE: 50, repE: 42, childE: 16, life: 230, mature: 40, speed: 82, meta: 0.22, prey: ['firefly', 'fish', 'jelly'], exc: 1, sense: 260, mv: MV_FLY, bite: 0.55, cost: 30, col: '#f4f7ff', col2: '#ffd36b', desc: '毛茸茸的棉花鸟，捕食萤火团、泡泡鱼、星星水母。' },
  { key: 'whale', name: '云朵鲸', unlock: 7, r: 34, maxE: 420, repE: 360, childE: 140, life: 900, mature: 160, speed: 24, meta: 0.85, eat: [0, 1], exc: 0, sense: 260, mv: MV_FLOAT, cost: 200, col: '#bfe0ff', col2: '#ffffff', desc: '巨大温柔的云朵鲸，什么能量都吃，排出光能。' },
  { key: 'dragon', name: '糖豆龙', unlock: 8, r: 26, maxE: 320, repE: 280, childE: 100, life: 720, mature: 140, speed: 64, meta: 0.8, prey: ['bear', 'bird', 'whale', 'fox'], exc: 1, sense: 300, mv: MV_WALK, pair: true, bite: 0.4, cost: 180, col: '#9dffb0', col2: '#ffe38a', desc: '顶级掠食者糖豆龙，捕食布丁熊、棉花鸟、云朵鲸、圆滚狸。' },
];
const NS = SPECIES.length;
const SP_IDX = {}; SPECIES.forEach((s, i) => { s.id = i; SP_IDX[s.key] = i; });
// 预计算：食物链掩码
const S_eatMask = new Uint8Array(NS), S_preyMask = new Uint32Array(NS), S_predMask = new Uint32Array(NS);
SPECIES.forEach((s, i) => {
  if (s.eat) for (const t of s.eat) S_eatMask[i] |= 1 << t;
  if (s.prey) for (const k of s.prey) { const j = SP_IDX[k]; S_preyMask[i] |= 1 << j; S_predMask[j] |= 1 << i; }
});
const S_r = Float32Array.from(SPECIES, s => s.r), S_speed = Float32Array.from(SPECIES, s => s.speed), S_meta = Float32Array.from(SPECIES, s => s.meta);
const S_life = Float32Array.from(SPECIES, s => s.life), S_maxE = Int32Array.from(SPECIES, s => s.maxE), S_mv = Uint8Array.from(SPECIES, s => s.mv);
const S_mass = Float32Array.from(SPECIES, s => s.r * s.r);

/* 观测者装置表
   cost: 占用建造额度；time: 建造秒数；r: 作用半径；len: 线段装置长度 */
const DEVICES = [

/* ---------- 离线推演 ---------- */
let offCancel = false;
function runOffline(sec, title, done) {
  sec = Math.min(sec, 12 * 3600);
  const before = { lv: G.lv, pop: cN, sp: Array.from(G.spCount), births: G.births, deaths: G.deaths, t: G.t, L: ledger() };
  const ext = new Set(), newSp = new Set(); let maxLvSeen = G.lv, minLvSeen = G.lv;
  $('offline').classList.add('show'); $('offTxt').textContent = title || '你离开期间，生态圈仍在运转'; offCancel = false;
  const tStart = performance.now(); let simmed = 0, dt = 0.25; const budget = 9000;
  // 先测速
  const t0 = performance.now(); for (let k = 0; k < 8 && simmed < sec; k++) { simStep(dt); simmed += dt; G.events.length = 0; }
  const ms = Math.max(0.3, (performance.now() - t0) / 8); const steps = budget / ms; dt = Math.max(0.25, Math.min(4, (sec - simmed) / steps));
  function chunk() {
    const c0 = performance.now();
    while (simmed < sec && performance.now() - c0 < 50) {
      const d = Math.min(dt, sec - simmed); simStep(d); simmed += d;
      for (const e of G.events) { if (e.type === 'extinct') ext.add(e.a); if (e.type === 'lv') { maxLvSeen = Math.max(maxLvSeen, e.a); minLvSeen = Math.min(minLvSeen, e.a); } if (e.type === 'unlock') newSp.add(e.a + ':' + e.b); if (e.type === 'win') G._winPending = true; }
      G.events.length = 0;
    }
    $('offBar').firstChild.style.width = (simmed / sec * 100).toFixed(1) + '%';
    if (simmed < sec && !offCancel && performance.now() - tStart < budget * 1.6) setTimeout(chunk, 0);
    else {
      $('offline').classList.remove('show');
      const rep = { sec: simmed, want: sec, before, after: { lv: G.lv, pop: cN, sp: Array.from(G.spCount) }, births: G.births - before.births, deaths: G.deaths - before.deaths, ext: [...ext], maxLv: maxLvSeen, minLv: minLvSeen };
      showReport(rep); saveGame(true); if (done) done(rep);

  }

}
function fmtTime(s) { s = Math.round(s); if (s < 60) return s + ' 秒'; if (s < 3600) return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒'; return Math.floor(s / 3600) + ' 小时 ' + Math.floor(s % 3600 / 60) + ' 分'; }

  const collapsed = r.after.pop === 0 && r.before.pop > 0;
  $('repBox').innerHTML = `<div style="font-size:19px;font-weight:700">${collapsed ? '💀 生态圈崩溃了…' : r.after.lv > r.before.lv ? '🌊 潮汐上涨！' : r.after.lv < r.before.lv ? '🌘 潮汐退去了…' : '🎁 开盲盒时间'}</div>

    if (UI.state !== 'play') return; const k = e.key.toLowerCase(); UI.keys[k] = true;
    if (k === ' ') { e.preventDefault(); }
    if (k === 'escape') { if (UI.panel) closePanel(); else if (UI.build >= 0) exitBuild(); else { UI.selId = 0; UI.selDev = null; $('card').style.display = 'none'; } }
    if (k === 'b' && !UI.panel) openTower(0);
    if (k === 'r') UI.ang += Math.PI / 8;
    if (k === '=' || k === '+') CAM.tz = Math.min(3, CAM.tz * 1.2); if (k === '-') CAM.tz = Math.max(0.2, CAM.tz / 1.2);
  });
  addEventListener('keyup', e => { UI.keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { UI.keys = {}; });
  c.addEventListener('wheel', e => { e.preventDefault(); CAM.tz = Math.max(0.2, Math.min(3, CAM.tz * Math.pow(1.0015, -e.deltaY))); }, { passive: false });
  c.addEventListener('contextmenu', e => { e.preventDefault(); if (UI.build >= 0) exitBuild(); });
  c.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' && !UI.touch) { UI.touch = true; document.body.classList.add('touch'); }
    AU.init(); c.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { downPos = { x: e.clientX, y: e.clientY, t: performance.now(), btn: e.button }; dragMoved = false; }
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = CAM.tz; dragMoved = true; }
  });
  c.addEventListener('pointermove', e => {
    if (UI.build >= 0 && e.pointerType === 'mouse') UI.ghost = s2w(e.clientX, e.clientY);
    if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) CAM.tz = CAM.z = Math.max(0.2, Math.min(3, zoom0 * d / pinch0)); }
    else if (downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 12) { dragMoved = true; if (UI.build >= 0 && e.pointerType !== 'mouse') UI.ghost = s2w(e.clientX, e.clientY); }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if (ptrs.size === 0 && downPos && !dragMoved && downPos.btn === 0 && UI.state === 'play') tap(e.clientX, e.clientY, e.pointerType !== 'mouse');
    if (ptrs.size === 0) downPos = null;
  };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); downPos = null; });
  // 摇杆
  const joy = $('joy'), K = $('joyK');
  joy.addEventListener('pointerdown', e => { e.stopPropagation(); AU.init(); UI.joy.id = e.pointerId; joy.setPointerCapture(e.pointerId); mv(e); });
  const mv = e => { if (UI.joy.id !== e.pointerId) return; const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy), m = 50; if (d > m) { dx *= m / d; dy *= m / d; } UI.joy.x = dx / m; UI.joy.y = dy / m; K.style.transform = `translate(${dx}px,${dy}px)`; };
  joy.addEventListener('pointermove', mv);
  const jup = e => { if (UI.joy.id !== e.pointerId) return; UI.joy.id = null; UI.joy.x = UI.joy.y = 0; K.style.transform = ''; };
  joy.addEventListener('pointerup', jup); joy.addEventListener('pointercancel', jup);
  const att = $('attBtn');
  att.addEventListener('pointerdown', e => { e.stopPropagation(); UI.attTouch = true; att.setPointerCapture(e.pointerId); });
  att.addEventListener('pointerup', () => UI.attTouch = false); att.addEventListener('pointercancel', () => UI.attTouch = false);
  $('bTower').onclick = () => openTower(0); $('bDex').onclick = openDex; $('bSpeed').onclick = openSpeed; $('bMenu').onclick = openMenu;
  $('pClose').onclick = () => { AU.play('click'); closePanel(); };
  $('panel').addEventListener('pointerdown', e => { if (e.target === $('panel')) closePanel(); });
  $('tide').onclick = () => openTower(2);
  $('stats').onclick = () => { UI.statsOpen = !UI.statsOpen; updateHUD(); };
  $('bbCancel').onclick = exitBuild; $('bbRot').onclick = () => { UI.ang += Math.PI / 8; }; $('bbOk').onclick = tryPlace;
  $('offSkip').onclick = () => { offCancel = true; };
  $('hint').onclick = () => { META.tut++; saveMeta(); updateHint(); };
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (UI.state !== 'play') return;
    if (document.hidden) { UI.hidden = Date.now(); saveGame(true); Ads.gameplayStop(); }
    else { Ads.gameplayStart(); const away = (Date.now() - UI.hidden) / 1000; if (UI.hidden && away > 30) runOffline(away); UI.hidden = 0; last = performance.now(); }
  });
  addEventListener('pagehide', () => saveGame(true));
  addEventListener('beforeunload', () => saveGame(true));
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1; if (dt <= 0) return;
  if (UI.state !== 'play') return;
  if ($('offline').classList.contains('show')) return;
  const k = UI.keys, o = G.orb;
  let ix = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0) + UI.joy.x, iy = (k.s || k.arrowdown ? 1 : 0) - (k.w || k.arrowup ? 1 : 0) + UI.joy.y;
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  o.ix = ix; o.iy = iy; o.attract = !!(k[' '] || UI.attTouch);
  const spd = UI.boostT > 0 ? 4 : 1; if (UI.boostT > 0) UI.boostT -= dt;
  const simDt = dt * spd, n = Math.ceil(simDt / 0.075);
  for (let s = 0; s < n; s++) simStep(simDt / n);
  processEvents();
  if (G._pulse > 0) G._pulse -= dt * 0.6;
  AU.setDrill && AU.ac && AU.setDrill(o.drill);
  // 镜头：静态锁定白球，平滑缩放
  CAM.z += (CAM.tz - CAM.z) * Math.min(1, dt * 8); CAM.x = o.x; CAM.y = o.y;
  render(dt, UI);
  hudT -= dt; if (hudT <= 0) { hudT = 0.3; updateHUD(); }
  mmT -= dt; if (mmT <= 0) { mmT = 0.5; drawMinimap(); }
  if (performance.now() - UI.lastSave > 20000) saveGame(true);
}

/* ---------- 流程 ---------- */
function showTitle() {
  UI.state = 'title'; Ads.gameplayStop(); $('start').style.display = 'flex';
  const has = !!localStorage.getItem(SAVE_KEY);
  $('bStart').textContent = has ? '继续游戏' : '开始游戏'; $('bNew').style.display = has ? '' : 'none';
  $('startIcons').innerHTML = SPECIES.map((s, i) => `<img src="${speciesIcon(i, 64)}" style="animation-delay:${i * 0.15}s;${G.unlocked.includes(s.key) ? '' : 'filter:brightness(0) opacity(.4)'}">`).join('');
  $('ver').textContent = 'v' + VERSION + (META.bestLv ? ' · 历史最高潮汐 Lv.' + META.bestLv : '');
}
function beginPlay() { $('start').style.display = 'none'; UI.state = 'play'; last = performance.now(); Ads.gameplayStart(); AU.init(); AU.setOn(META.sound !== false); AU.setMus(META.music !== false); updateHUD(); drawMinimap(); }
function startNew() {
  const keepUnlocked = G.unlocked.slice();
  newGame(); G.unlocked = Array.from(new Set(keepUnlocked.concat(G.unlocked)));
  UI.selId = 0; UI.selDev = null; exitBuild(); CAM.tz = CAM.z = 1;
  for (let i = 0; i < GN * GN; i++) paintCell(i); floorDirty = true; rimDirty = true;
  beginPlay(); saveGame(true); toast('🌱 新的世界诞生了');
}
function continueGame() {
  const s = loadGame(); if (!s) { startNew(); return; }
  for (let i = 0; i < GN * GN; i++) paintCell(i); floorDirty = true; rimDirty = true;
  beginPlay(); const away = (Date.now() - s.savedAt) / 1000;
  if (away > 30) runOffline(away);
}
function boot() {
  loadMeta();
  G.unlocked = META.unlocked && META.unlocked.length ? META.unlocked.slice() : [];
  AU.on = META.sound !== false; AU.musOn = META.music !== false;
  initRender($('c')); buildSprites();
  newGame(1); // 标题背景世界
  G.unlocked = Array.from(new Set(G.unlocked.concat(META.unlocked || [])));
  for (let i = 0; i < GN * GN; i++) paintCell(i);
  setupInput(); Ads.init().then(() => Ads.loadingDone());
  $('bStart').onclick = () => { AU.init(); AU.play('click'); if (localStorage.getItem(SAVE_KEY)) continueGame(); else startNew(); };
  $('bNew').onclick = () => { if (confirm('确定开始新的世界吗？当前世界会被覆盖（解锁的物种保留）。')) { AU.init(); startNew(); } };
  showTitle(); requestAnimationFrame(frame);
}
window.addEventListener('load', boot);

</script>
</body>
</html>
