<style>

body.pOpen #joy,body.pOpen #attBtn,body.pOpen #card{display:none!important}
#panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cardx{border:1px solid rgba(120,200,255,.2);border-radius:12px;padding:9px;background:rgba(255,255,255,.03);cursor:pointer;position:relative;transition:background .15s}
.cardx:hover{background:rgba(120,200,255,.1)}

.cardx .nm{font-weight:700;font-size:14px}
.cardx .ds{font-size:11px;opacity:.75;line-height:1.45}

.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.08);margin:2px 3px 0 0}

#start .sub{opacity:.75;font-size:14px;text-align:center;max-width:560px;line-height:1.8;padding:0 16px}

#offBar{height:10px;border-radius:5px;background:#123;overflow:hidden}#offBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fd8ff,#ffb3f2)}
canvas.spark{width:100%;height:90px;display:block;background:rgba(255,255,255,.03);border-radius:8px}
table.tb{border-collapse:collapse;width:100%;font-size:12px}table.tb td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.06)}

  #tideLv{font-size:14px}
  #mm{width:100px;height:100px;top:auto;bottom:auto;right:10px;top:84px}

</style>

<body>
<canvas id="c"></canvas>
<div id="stats" class="hud glass"></div>
<div id="tide" class="hud glass"><div id="tideLv">潮汐 Lv.0</div><div id="tideBar"><div id="tideFill"></div><div id="tideWin"></div></div><div id="tideSub"></div></div>

<div id="side" class="hud">
  <button class="btn sbtn" id="bTower"><span>🔷</span>方塔</button>
  <button class="btn sbtn" id="bDex"><span>📖</span>图鉴</button>
  <button class="btn sbtn ad" id="bSpeed"><span>⏩</span>加速</button>
  <button class="btn sbtn" id="bMenu"><span>☰</span>菜单</button>
</div>

<div id="joy" class="hud"><div id="joyK"></div></div>
<button id="attBtn" class="hud btn">吸引<br>能量</button>
<div id="panel"><div id="pBox" class="glass"><div id="pHead"><div id="pTitle"></div><button class="btn" id="pClose">✕</button></div><div id="pTabs"></div><div id="pBody"></div></div></div>
<div id="adSim"><div>📺 模拟广告（本地测试模式）</div><div id="adCount">3</div><div style="font-size:12px;opacity:.6">上传到 CrazyGames / Playgama / Poki 等平台后会自动替换为真实广告</div><button class="btn" id="adSkip">取消</button></div>
<div id="offline" class="overlay"><div class="glass"><div style="font-size:18px;font-weight:700">🌙 离线推演中…</div><div id="offTxt" style="opacity:.8">你离开期间，生态圈仍在运转</div><div id="offBar"><i></i></div><button class="btn" id="offSkip" style="margin-top:10px">跳过剩余推演</button></div></div>
<div id="report" class="overlay" style="background:rgba(0,0,0,.6)"><div class="glass" id="repBox"></div></div>
<div id="start" class="overlay">
  <h1>潮汐生态圈</h1>
  <div class="sub">在黑墙包围的圆形小世界里，搭配可爱的生物与异星观测装置，<br>让能量守恒的生态圈稳定运转，把【观测潮汐】推向最高等级。</div>
  <div class="icons" id="startIcons"></div>
  <button class="btn big" id="bStart">开始游戏</button>
  <button class="btn" id="bNew" style="display:none">新的世界（重新开始）</button>
  <div class="keys">电脑：WASD / 方向键移动 · 点击地面瞬移 · 滚轮缩放 · 按住空格吸引能量 · 撞向黑墙可消融 · B 打开方塔 · R 旋转 · Esc 取消<br>手机：左下摇杆移动 · 点地面瞬移 · 双指缩放 · 右下按钮吸引能量</div>
  <div class="keys" id="ver"></div>
</div>
<script>
'use strict';
/* ===================== 常量与数据表（v0.4：单一能量 + 战力制度） ===================== */
const VERSION = '0.4';
const CELL = 24, GN = 400, HALF = GN * CELL / 2;      // 墙体网格：400x400 格，每格 24px，世界 ±4800
const SC = 48, SN = 200, SNC = SN * SN;               // 空间网格
const MAXP = 240000, MAXC = 24000;
const START_R = 470, VOID_R = 4550;
const TOWER_R = 40, TOWER_FIELD = 250, PYLON_FIELD = 175, TOWER_PULL = 300;
const WINDOW = 10;
const RIPEN = 4;                                      // 新释放的能量需要 4 秒凝结才能被吃
const THRESH = [0, 2, 6, 14, 28, 50, 80, 120, 175, 250, 350];
const MAXLV = 10;
const LV_NAMES = ['沉寂', '微澜', '涟漪', '细流', '回涌', '潮起', '盈潮', '大潮', '天潮', '星潮', '永恒之潮'];
const LV_COLORS = ['#707a88', '#6fd8ff', '#5ff0c8', '#8cff7a', '#e6ff6a', '#ffd35a', '#ff9f5a', '#ff6fa8', '#c77dff', '#8f9bff', '#ffffff'];

const MV_WALK = 0, MV_SLOW = 1, MV_HOP = 2, MV_FLY = 3, MV_FLOAT = 4, MV_ORBIT = 5;
// 食性
const D_E = 0, D_M = 1, D_O = 2;
const DIET_NAME = ['食能', '食肉', '杂食'];
// 对同类
const SOC_HERD = 0, SOC_TERR = 1, SOC_PACK = 2, SOC_SOLO = 3;
const SOC_NAME = ['群居', '领地', '猎团', '独行'];
const SOC_DESC = ['同类聚在一起，附近同类越多战力越高（最多 +80%）', '会驱赶靠近的同类（非致命打斗）', '和同类一起狩猎，附近同伴越多战力越高', '独来独往'];
// 对异类
const AL_TIMID = 0, AL_MOB = 1, AL_TERR = 2, AL_BOLD = 3, AL_PASSIVE = 4;
const AL_NAME = ['胆小', '抱团反击', '护食', '无畏', '被动捕食'];
const AL_DESC = ['遇到打不过的捕食者就逃', '群体战力够时会一起反击捕食者', '会赶走来抢能量的其他食能生物', '不怕比自己弱的对手', '不追猎，碰到猎物就蛰'];

/* 生物表 —— pow: 基础战力；shell: 被攻击时防御倍率 */
const SPECIES = [
  { key: 'slime', name: '啵啵史莱姆', unlock: 0, r: 9, maxE: 16, repE: 13, childE: 6, life: 50, mature: 8, speed: 38, meta: 0.22, diet: D_E, pow: 1.0, soc: SOC_HERD, al: AL_MOB, mv: MV_WALK, cost: 8, col: '#7cf5b0', col2: '#3fc98a', desc: '软糯的群居史莱姆。一只很弱，一群就敢反击捕食者。分裂繁殖。' },
  { key: 'bunny', name: '团子兔', unlock: 0, r: 10, maxE: 18, repE: 12, childE: 6, life: 42, mature: 7, speed: 64, meta: 0.24, diet: D_E, pow: 0.8, soc: SOC_HERD, al: AL_TIMID, mv: MV_HOP, pair: true, cost: 8, col: '#fff4fa', col2: '#ffb8d6', desc: '跑得快、生得多、死得也快的麻薯兔。胆小，需要两只才能繁殖。' },
  { key: 'fox', name: '圆滚狸', unlock: 1, r: 13, maxE: 46, repE: 24, childE: 12, life: 160, mature: 20, speed: 76, meta: 0.28, diet: D_M, prey: ['slime', 'bunny', 'fish', 'mush'], pow: 3.5, soc: SOC_PACK, al: AL_BOLD, mv: MV_WALK, pair: true, cost: 30, col: '#ffb45c', col2: '#fff0dc', desc: '成群狩猎的小狸，只吃生物。专挑落单和虚弱的猎物。' },
  { key: 'mush', name: '菇菇仔', unlock: 1, r: 10, maxE: 26, repE: 20, childE: 9, life: 100, mature: 14, speed: 16, meta: 0.36, diet: D_E, reach: 12, pow: 2.2, soc: SOC_TERR, al: AL_TERR, mv: MV_SLOW, cost: 12, col: '#ff8a8a', col2: '#fff1dc', desc: '用菌丝远距离吸收能量（吃食范围很大），代谢极低。慢吞吞但很凶，会赶走抢食者和同类。' },
  { key: 'firefly', name: '萤火团', unlock: 2, r: 6, maxE: 8, repE: 6, childE: 3, life: 24, mature: 5, speed: 44, meta: 0.12, diet: D_E, pow: 0.35, soc: SOC_HERD, al: AL_TIMID, mv: MV_FLY, cost: 5, col: '#fff27a', col2: '#9be86a', desc: '成群飞舞的小光团，地面捕食者抓不到它。寿命极短、繁殖极快。' },
  { key: 'bird', name: '棉花鸟', unlock: 2, r: 12, maxE: 38, repE: 20, childE: 10, life: 150, mature: 18, speed: 85, meta: 0.24, diet: D_M, prey: ['firefly', 'fish', 'slime', 'bunny'], pow: 3, soc: SOC_SOLO, al: AL_BOLD, mv: MV_FLY, pair: true, cost: 24, col: '#f4f7ff', col2: '#ffd36b', desc: '独行的空中猎手，速度极快，捕食小型生物。' },
  { key: 'fish', name: '泡泡鱼', unlock: 3, r: 8, maxE: 12, repE: 9, childE: 4, life: 38, mature: 6, speed: 60, meta: 0.16, diet: D_E, pow: 0.6, soc: SOC_HERD, al: AL_TIMID, mv: MV_FLOAT, cost: 6, col: '#7ab8ff', col2: '#cfe6ff', desc: '在空气里游泳的鱼群，结队吃能量。' },
  { key: 'snail', name: '果冻蜗牛', unlock: 3, r: 11, maxE: 40, repE: 30, childE: 12, life: 180, mature: 30, speed: 11, meta: 0.46, diet: D_E, pow: 1.2, shell: 3, soc: SOC_SOLO, al: AL_BOLD, mv: MV_SLOW, cost: 20, col: '#c9a8ff', col2: '#ffd1f0', desc: '背着果冻硬壳，被攻击时防御 ×3。长寿、慢、稳定。' },
  { key: 'jelly', name: '星星水母', unlock: 4, r: 11, maxE: 36, repE: 28, childE: 12, life: 130, mature: 20, speed: 26, meta: 0.2, diet: D_M, prey: ['slime', 'bunny', 'firefly', 'fish', 'fox', 'bird'], pow: 3, soc: SOC_SOLO, al: AL_PASSIVE, mv: MV_ORBIT, cost: 22, col: '#9ff0ff', col2: '#ffb3f2', desc: '绕着方塔漂浮的陷阱型捕食者：不追猎，碰到它的生物会被蛰。' },
  { key: 'bear', name: '布丁熊', unlock: 5, r: 20, maxE: 120, repE: 96, childE: 40, life: 220, mature: 40, speed: 50, meta: 0.55, diet: D_O, prey: ['fox', 'snail', 'fish', 'bunny', 'slime', 'mush'], pow: 6, soc: SOC_TERR, al: AL_TERR, mv: MV_WALK, pair: true, cost: 60, col: '#e8b27a', col2: '#fff3c4', desc: '杂食大块头。既吃能量也吃生物，领地意识强。' },
  { key: 'whale', name: '云朵鲸', unlock: 6, r: 34, maxE: 300, repE: 240, childE: 100, life: 360, mature: 70, speed: 22, meta: 1.8, diet: D_E, pow: 9, soc: SOC_HERD, al: AL_BOLD, mv: MV_FLOAT, cost: 150, col: '#bfe0ff', col2: '#ffffff', desc: '巨大温柔的食能者，几乎没有天敌，但吃得非常多。' },
  { key: 'dragon', name: '糖豆龙', unlock: 7, r: 26, maxE: 240, repE: 200, childE: 80, life: 300, mature: 60, speed: 64, meta: 0.8, diet: D_M, prey: ['bear', 'bird', 'fox', 'whale', 'jelly'], pow: 12, soc: SOC_TERR, al: AL_BOLD, mv: MV_WALK, pair: true, cost: 140, col: '#9dffb0', col2: '#ffe38a', desc: '顶级掠食者，捕食布丁熊、云朵鲸等大型生物。' },
];
const NS = SPECIES.length;
const SP_IDX = {}; SPECIES.forEach((s, i) => { s.id = i; SP_IDX[s.key] = i; });

/* ===================== 万能广告适配层 =====================
   自动识别：CrazyGames SDK v3 / Playgama Bridge / Poki SDK / GameDistribution
   上传到对应平台时，只需在 <head> 里取消注释对应 SDK 的 <script> 即可；
   没有 SDK 时使用本地“模拟广告”（3 秒），保证单机可玩、可测试。 */
const Ads = {
  platform: 'local', ready: false, busy: false,
  async init() {
    try {
      if (window.CrazyGames && window.CrazyGames.SDK) { this.platform = 'crazygames'; try { await window.CrazyGames.SDK.init(); } catch (e) { } }
      else if (window.bridge && window.bridge.initialize) { this.platform = 'playgama'; await window.bridge.initialize(); }
      else if (window.PokiSDK) { this.platform = 'poki'; await window.PokiSDK.init(); }
      else if (window.gdsdk) { this.platform = 'gamedistribution'; }
    } catch (e) { console.warn('ads init', e); this.platform = 'local'; }
    this.ready = true;
  },
  gameplayStart() { try { if (this.platform === 'crazygames') window.CrazyGames.SDK.game.gameplayStart(); else if (this.platform === 'poki') window.PokiSDK.gameplayStart(); else if (this.platform === 'playgama' && window.bridge.platform && window.bridge.platform.sendMessage) window.bridge.platform.sendMessage('gameplay_started'); } catch (e) { } },
  gameplayStop() { try { if (this.platform === 'crazygames') window.CrazyGames.SDK.game.gameplayStop(); else if (this.platform === 'poki') window.PokiSDK.gameplayStop(); else if (this.platform === 'playgama' && window.bridge.platform && window.bridge.platform.sendMessage) window.bridge.platform.sendMessage('gameplay_stopped'); } catch (e) { } },
  happytime() { try { if (this.platform === 'crazygames') window.CrazyGames.SDK.game.happytime(); } catch (e) { } },
  loadingDone() { try { if (this.platform === 'playgama' && window.bridge.platform && window.bridge.platform.sendMessage) window.bridge.platform.sendMessage('game_ready'); if (this.platform === 'poki') window.PokiSDK.gameLoadingFinished(); } catch (e) { } },
  // 激励广告：成功 → onReward()，失败/取消 → onFail(msg)
  rewarded(onReward, onFail) {
    if (this.busy) return; this.busy = true;
    const done = (ok, msg) => { this.busy = false; AU.duck(false); if (ok) onReward(); else if (onFail) onFail(msg || '广告未完成'); };
    AU.duck(true);
    try {
      if (this.platform === 'crazygames') {
        window.CrazyGames.SDK.ad.requestAd('rewarded', { adStarted: () => { }, adFinished: () => done(true), adError: (e) => done(false, '暂时没有广告') });
      } else if (this.platform === 'playgama') {
        const b = window.bridge; let rewarded = false;
        const h = (state) => { if (state === 'rewarded') rewarded = true; if (state === 'closed' || state === 'failed') { try { b.advertisement.off(b.EVENT_NAME.REWARDED_STATE_CHANGED, h); } catch (e) { } done(rewarded || state === 'rewarded', '暂时没有广告'); } };
        b.advertisement.on(b.EVENT_NAME.REWARDED_STATE_CHANGED, h); b.advertisement.showRewarded();
      } else if (this.platform === 'poki') {
        window.PokiSDK.rewardedBreak().then(ok => done(!!ok, '广告未完成'));
      } else if (this.platform === 'gamedistribution') {
        window.gdsdk.showAd('rewarded').then(() => done(true)).catch(() => done(false, '暂时没有广告'));
      } else this.localAd(done);
    } catch (e) { done(false, '广告出错'); }
  },
  localAd(done) {
    const m = document.getElementById('adSim'), c = document.getElementById('adCount'); if (!m) { done(true); return; }
    m.classList.add('show'); let n = 3; c.textContent = n;
    const iv = setInterval(() => { n--; c.textContent = n; if (n <= 0) { clearInterval(iv); m.classList.remove('show'); done(true); } }, 1000);
    document.getElementById('adSkip').onclick = () => { clearInterval(iv); m.classList.remove('show'); done(false, '已取消'); };
  },
};

    if (UI.state !== 'play') return;
    if (document.hidden) { UI.hidden = Date.now(); saveGame(true); Ads.gameplayStop(); }
    else { Ads.gameplayStart(); const away = (Date.now() - UI.hidden) / 1000; if (UI.hidden && away > 30) runOffline(away); UI.hidden = 0; last = performance.now(); }
  });
  addEventListener('pagehide', () => saveGame(true));
  addEventListener('beforeunload', () => saveGame(true));
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1; if (dt <= 0) return;
  if (UI.state !== 'play') return;
  if ($('offline').classList.contains('show')) return;
  const k = UI.keys, o = G.orb;
  let ix = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0) + UI.joy.x, iy = (k.s || k.arrowdown ? 1 : 0) - (k.w || k.arrowup ? 1 : 0) + UI.joy.y;
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  o.ix = ix; o.iy = iy; o.attract = !!(k[' '] || UI.attTouch);
  const spd = UI.boostT > 0 ? 4 : 1; if (UI.boostT > 0) UI.boostT -= dt;
  const simDt = dt * spd, n = Math.ceil(simDt / 0.075);
  for (let s = 0; s < n; s++) simStep(simDt / n);
  processEvents();
  if (G._pulse > 0) G._pulse -= dt * 0.6;
  AU.setDrill && AU.ac && AU.setDrill(o.drill);
  // 镜头：静态锁定白球，平滑缩放
  CAM.z += (CAM.tz - CAM.z) * Math.min(1, dt * 8); CAM.x = o.x; CAM.y = o.y;
  render(dt, UI);
  hudT -= dt; if (hudT <= 0) { hudT = 0.3; updateHUD(); }
  mmT -= dt; if (mmT <= 0) { mmT = 0.5; drawMinimap(); }
  if (performance.now() - UI.lastSave > 20000) saveGame(true);
}

/* ---------- 流程 ---------- */
function showTitle() {
  UI.state = 'title'; Ads.gameplayStop(); $('start').style.display = 'flex';
  const has = !!localStorage.getItem(SAVE_KEY);
  $('bStart').textContent = has ? '继续游戏' : '开始游戏'; $('bNew').style.display = has ? '' : 'none';
  $('startIcons').innerHTML = SPECIES.map((s, i) => `<img src="${speciesIcon(i, 64)}" style="animation-delay:${i * 0.15}s;${G.unlocked.includes(s.key) ? '' : 'filter:brightness(0) opacity(.4)'}">`).join('');
  $('ver').textContent = 'v' + VERSION + (META.bestLv ? ' · 历史最高潮汐 Lv.' + META.bestLv : '');
}
function beginPlay() { $('start').style.display = 'none'; UI.state = 'play'; last = performance.now(); Ads.gameplayStart(); AU.init(); AU.setOn(META.sound !== false); AU.setMus(META.music !== false); updateHUD(); drawMinimap(); }
function startNew() {
  const keepUnlocked = G.unlocked.slice();
  newGame(); G.unlocked = Array.from(new Set(keepUnlocked.concat(G.unlocked)));
  UI.selId = 0; UI.selDev = null; exitBuild(); CAM.tz = CAM.z = 1;
  rebuildFloor();
  beginPlay(); saveGame(true); toast('🌱 新的世界诞生了');
}
function continueGame() {
  const s = loadGame(); if (!s) { startNew(); return; }
  rebuildFloor();
  beginPlay(); const away = (Date.now() - s.savedAt) / 1000;
  if (away > 30) runOffline(away);
}
function boot() {
  loadMeta();
  G.unlocked = META.unlocked && META.unlocked.length ? META.unlocked.slice() : [];
  AU.on = META.sound !== false; AU.musOn = META.music !== false;
  initRender($('c')); buildSprites();
  newGame(1); // 标题背景世界
  G.unlocked = Array.from(new Set(G.unlocked.concat(META.unlocked || [])));
  for (let i = 0; i < GN * GN; i++) paintCell(i);
  setupInput(); Ads.init().then(() => Ads.loadingDone());
  $('bStart').onclick = () => { AU.init(); AU.play('click'); if (localStorage.getItem(SAVE_KEY)) continueGame(); else startNew(); };
  $('bNew').onclick = () => { if (confirm('确定开始新的世界吗？当前世界会被覆盖（解锁的物种保留）。')) { AU.init(); startNew(); } };
  showTitle(); requestAnimationFrame(frame);
}
window.addEventListener('load', boot);

</script>
</body>
