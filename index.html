<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>潮汐生态圈 · 重建中</title>
<style>html,body{margin:0;height:100%;background:#000;color:#cfe;font-family:sans-serif;overflow:hidden}#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}button{font-size:20px;padding:12px 30px;border-radius:30px;border:1px solid #7cf;background:#0a2030;color:#dff}</style></head><body>
<canvas id="c"></canvas><div id="s"><h2>潮汐生态圈 · 正在重建</h2><button id="b">开始游戏（预览）</button></div>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,px=0,py=0,k={},on=false;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();onresize=rs;
onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;c.onclick=e=>{px+=e.clientX-W/2;py+=e.clientY-H/2};
document.getElementById('b').onclick=()=>{document.getElementById('s').remove();on=true};const P=[];for(let i=0;i<400;i++){const a=Math.random()*6.28,r=Math.random()**2*120;P.push([Math.cos(a)*r,Math.sin(a)*r])}
(function f(){requestAnimationFrame(f);if(on){px+=((k.d||k.arrowright)-(k.a||k.arrowleft))*3||0;py+=((k.s||k.arrowdown)-(k.w||k.arrowup))*3||0;const d=Math.hypot(px,py);if(d>380){px*=380/d;py*=380/d}}
x.fillStyle='#000';x.fillRect(0,0,W,H);x.save();x.translate(W/2-px,H/2-py);x.fillStyle='#0b1426';x.beginPath();x.arc(0,0,400,0,7);x.fill();x.fillStyle='#8ff';for(const p of P)x.fillRect(p[0],p[1],2,2);x.fillStyle='#fff';x.beginPath();x.arc(px,py,12,0,7);x.fill();x.restore()})();</script></body></html>
