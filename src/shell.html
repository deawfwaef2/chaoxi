<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>潮汐生态圈 · Chaoxi</title>
<!--
  ===== 平台广告 SDK（上传到对应平台时，取消注释其中一行即可，游戏会自动识别） =====
  CrazyGames:  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  Playgama:    <script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
  Poki:        <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  GameDistribution: 按其后台说明注入 GD_OPTIONS 与 main.min.js
  没有检测到 SDK 时使用本地“模拟广告”（3 秒倒计时），保证单机可玩。
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#e6f3ff;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(8,16,30,.66);border:1px solid rgba(120,200,255,.2);border-radius:14px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.hud{position:fixed;z-index:5}
#stats{left:10px;top:10px;font-size:12px;line-height:1.6;padding:8px 11px;min-width:196px;cursor:pointer}
#stats b{color:#aef}#stats .ok{color:#7dffa8}#stats .bad{color:#ff7d7d}#stats .dim{opacity:.6}
#stats.mini .more{display:none}
.row{display:flex;justify-content:space-between;gap:10px}
.lc{color:#9ff4ff}.ec{color:#ffb070}.bc{color:#ffc8f0}.sc{color:#9aa}
#hpbar{height:5px;border-radius:3px;background:#223;margin-top:4px;overflow:hidden}#hpbar i{display:block;height:100%;background:linear-gradient(90deg,#8ff,#fff);width:100%}
#tide{left:50%;top:10px;transform:translateX(-50%);padding:8px 14px 9px;min-width:280px;text-align:center;cursor:pointer}
#tideLv{font-size:17px;font-weight:700;letter-spacing:1px}
#tideSub{font-size:11px;opacity:.75;margin-top:2px}
#tideBar{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
#tideFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;transition:width .3s}
#tideWin{position:absolute;left:0;bottom:0;height:2px;background:rgba(255,255,255,.6);width:0}
#mm{right:10px;top:10px;width:150px;height:150px;border-radius:50%;overflow:hidden;padding:0}
#mm canvas{width:100%;height:100%;display:block}
#side{right:10px;top:170px;display:flex;flex-direction:column;gap:8px}
.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(130,210,255,.35);background:rgba(10,26,44,.78);color:#dff4ff;border-radius:12px;padding:8px 12px;font-size:14px;font-family:inherit;transition:transform .1s,background .2s}
.btn:hover{background:rgba(26,56,86,.9)}.btn:active{transform:scale(.95)}
.btn.big{font-size:20px;padding:14px 40px;border-radius:30px}
.btn.ad{border-color:rgba(255,210,120,.6);color:#ffe7b0}
.btn.red{border-color:rgba(255,120,120,.5);color:#ffc0c0}
.sbtn{width:54px;height:54px;padding:0;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.sbtn span{font-size:20px}
#speedTag{right:74px;top:176px;font-size:12px;color:#ffe08a;display:none}
#toasts{left:10px;bottom:120px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;max-width:70vw}
.toast{font-size:13px;padding:7px 12px;border-radius:10px;background:rgba(8,16,30,.8);border:1px solid rgba(120,200,255,.25);animation:tin .3s;transition:opacity .6s}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#hint{left:50%;bottom:16px;transform:translateX(-50%);font-size:13px;padding:8px 14px;max-width:92vw;text-align:center;display:none;pointer-events:auto;cursor:pointer}
#card{left:50%;bottom:62px;transform:translateX(-50%);padding:10px 14px;font-size:12px;display:none;min-width:260px;max-width:92vw;pointer-events:auto}
#card .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
#card img{width:40px;height:40px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:3px 0 5px}.bar i{display:block;height:100%}
#buildBar{left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:8px;align-items:center;padding:8px 10px;font-size:13px}
#buildBar.show{display:flex}
#joy{left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(120,200,255,.08);border:1px solid rgba(120,200,255,.25);display:none;touch-action:none}
#joyK{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(200,240,255,.35);border:1px solid rgba(255,255,255,.5)}
#attBtn{right:18px;bottom:24px;width:74px;height:74px;border-radius:50%;display:none;font-size:12px}
body.touch #joy,body.touch #attBtn{display:block}
body.touch #hint{bottom:160px}
body.touch #card{bottom:160px}
body.touch #buildBar{bottom:160px}
body.touch #toasts{bottom:170px}
body.pOpen #joy,body.pOpen #attBtn,body.pOpen #card{display:none!important}
#panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
#panel.show{display:flex}
#pBox{width:min(760px,94vw);max-height:86vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
#pHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(120,200,255,.15)}
#pTitle{font-size:17px;font-weight:700}
#pTabs{display:flex;gap:6px;padding:8px 14px 0}
.tab{padding:6px 14px;border-radius:10px 10px 0 0;cursor:pointer;opacity:.6;border:1px solid transparent;font-size:14px}
.tab.on{opacity:1;background:rgba(120,200,255,.12);border-color:rgba(120,200,255,.2)}
#pBody{padding:12px 16px 16px;overflow:auto;font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cardx{border:1px solid rgba(120,200,255,.2);border-radius:12px;padding:9px;background:rgba(255,255,255,.03);cursor:pointer;position:relative;transition:background .15s}
.cardx:hover{background:rgba(120,200,255,.1)}
.cardx.lock{opacity:.4;cursor:not-allowed}
.cardx .nm{font-weight:700;font-size:14px}
.cardx .ds{font-size:11px;opacity:.75;line-height:1.45}
.cardx img{width:52px;height:52px;float:right;margin:-2px -2px 0 4px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.08);margin:2px 3px 0 0}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(circle at 50% 45%,#0c1a33 0%,#000 75%)}
#start h1{font-size:44px;margin:0;letter-spacing:6px;background:linear-gradient(90deg,#9ff4ff,#fff,#ffb3f2);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
#start .sub{opacity:.75;font-size:14px;text-align:center;max-width:560px;line-height:1.8;padding:0 16px}
#start .icons{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:600px}
#start .icons img{width:44px;height:44px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) scale(1.05,.95)}}
#start .keys{font-size:12px;opacity:.55;text-align:center;line-height:1.8;padding:0 10px}
#adSim{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.92);font-size:16px}
#adSim.show{display:flex}
#adCount{font-size:60px;font-weight:700;color:#ffe08a}
#report,#offline{display:none}
#report.show,#offline.show{display:flex}
#report .glass,#offline .glass{padding:20px 24px;max-width:92vw;width:440px;font-size:14px;line-height:1.8}
#offBar{height:10px;border-radius:5px;background:#123;overflow:hidden}#offBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fd8ff,#ffb3f2)}
canvas.spark{width:100%;height:90px;display:block;background:rgba(255,255,255,.03);border-radius:8px}
table.tb{border-collapse:collapse;width:100%;font-size:12px}table.tb td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
@media (max-width:700px){
  #stats{font-size:11px;min-width:150px;padding:6px 8px}
  #tide{top:auto;bottom:auto;top:10px;left:auto;right:10px;transform:none;min-width:0;width:calc(100vw - 190px);max-width:260px;padding:6px 10px}
  #tideLv{font-size:14px}
  #mm{width:100px;height:100px;top:auto;bottom:auto;right:10px;top:84px}
  #side{top:194px}
  #speedTag{top:200px}
  .sbtn{width:48px;height:48px}
  #start h1{font-size:32px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats" class="hud glass"></div>
<div id="tide" class="hud glass"><div id="tideLv">潮汐 Lv.0</div><div id="tideBar"><div id="tideFill"></div><div id="tideWin"></div></div><div id="tideSub"></div></div>
<div id="mm" class="hud glass"><canvas id="mmC" width="150" height="150"></canvas></div>
<div id="side" class="hud">
  <button class="btn sbtn" id="bTower"><span>🔷</span>方塔</button>
  <button class="btn sbtn" id="bDex"><span>📖</span>图鉴</button>
  <button class="btn sbtn ad" id="bSpeed"><span>⏩</span>加速</button>
  <button class="btn sbtn" id="bMenu"><span>☰</span>菜单</button>
</div>
<div id="speedTag" class="hud glass" style="padding:4px 8px"></div>
<div id="toasts" class="hud"></div>
<div id="hint" class="hud glass"></div>
<div id="card" class="hud glass"></div>
<div id="buildBar" class="hud glass"><span id="bbName"></span><button class="btn" id="bbRot">旋转</button><button class="btn" id="bbOk" style="display:none">确认建造</button><button class="btn red" id="bbCancel">取消</button></div>
<div id="joy" class="hud"><div id="joyK"></div></div>
<button id="attBtn" class="hud btn">吸引<br>能量</button>
<div id="panel"><div id="pBox" class="glass"><div id="pHead"><div id="pTitle"></div><button class="btn" id="pClose">✕</button></div><div id="pTabs"></div><div id="pBody"></div></div></div>
<div id="adSim"><div>📺 模拟广告（本地测试模式）</div><div id="adCount">3</div><div style="font-size:12px;opacity:.6">上传到 CrazyGames / Playgama / Poki 等平台后会自动替换为真实广告</div><button class="btn" id="adSkip">取消</button></div>
<div id="offline" class="overlay"><div class="glass"><div style="font-size:18px;font-weight:700">🌙 离线推演中…</div><div id="offTxt" style="opacity:.8">你离开期间，生态圈仍在运转</div><div id="offBar"><i></i></div><button class="btn" id="offSkip" style="margin-top:10px">跳过剩余推演</button></div></div>
<div id="report" class="overlay" style="background:rgba(0,0,0,.6)"><div class="glass" id="repBox"></div></div>
<div id="start" class="overlay">
  <h1>潮汐生态圈</h1>
  <div class="sub">在黑墙包围的圆形小世界里，搭配可爱的生物与异星观测装置，<br>让能量守恒的生态圈稳定运转，把【观测潮汐】推向最高等级。</div>
  <div class="icons" id="startIcons"></div>
  <button class="btn big" id="bStart">开始游戏</button>
  <button class="btn" id="bNew" style="display:none">新的世界（重新开始）</button>
  <div class="keys">电脑：WASD / 方向键移动 · 点击地面瞬移 · 滚轮缩放 · 按住空格吸引能量 · 撞向黑墙可消融 · B 打开方塔 · R 旋转 · Esc 取消<br>手机：左下摇杆移动 · 点地面瞬移 · 双指缩放 · 右下按钮吸引能量</div>
  <div class="keys" id="ver"></div>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
